name: Release

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, aligned with the API. Example: 1.159.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version and install
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install -g npm@latest
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm install --omit=dev --no-package-lock

      - name: Smoke check
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | timeout 20 node bin/linkbreakers-mcp.js | tee initialize.json
          grep -q '"serverInfo"' initialize.json

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(npm view "linkbreakers-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "linkbreakers-mcp@$VERSION is already on npm."
          else
            npm publish --provenance --access public
          fi

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet package.json; then
            git add package.json
            git commit -m "chore: release $VERSION"
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Close release failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Released v${VERSION}."
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Releasing linkbreakers-mcp v${{ steps.version.outputs.version || github.event.client_payload.version || inputs.version }} failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "::error title=linkbreakers-mcp release failed::${MESSAGE}"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The release workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "linkbreakers-mcp release failing" --body "$MESSAGE"
          fi
